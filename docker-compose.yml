# CenkorMES 一键部署（生产形态，全栈：后端 + 数据库 + 缓存 + 双前端）
#
# 启动：  docker compose up -d --build
# 停止：  docker compose down            # 保留数据卷
# 销毁：  docker compose down -v         # 连同 MySQL/Redis/存储数据卷一起删除
#
# 端口（可用同目录 .env 覆盖，例如 APP_PORT、WEB_ADMIN_PORT、WEB_H5_PORT）：
#   http://<主机IP>:8000   → 后端 API（含 /docs 交互文档）
#   http://<主机IP>:8080   → 管理后台 Web
#   http://<主机IP>:8081   → 员工 H5 Web
#   前端容器内已内置 nginx，/api 就地反代到 backend:8000，开箱即用。
#
# 默认内置：首启自动建表 + 自动建默认管理员（DB_AUTO_SEED=true）。
# 演示数据：可选执行一次 `bash docker/scripts/init-demo.sh`（幂等）。
#
# 安全：JWT_SECRET 生产务必自设强随机值（≥32 位），切勿使用默认值。
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cenkormes
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [cenkormes]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cenkormes]

  backend:
    build:
      context: .            # 仓库根目录（Dockerfile 以仓库根为构建上下文）
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # 对外端口默认 8000；容器内部固定 8000（前端反代目标）。
    # 若宿主 8000 已被占用（如本机已有其它项目占用了 8000），请在 .env 里设 APP_PORT=其它端口。
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: prod
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      DB_URL: "mysql+pymysql://root:root@mysql:3306/cenkormes?charset=utf8mb4"
      DB_ECHO: "false"
      DB_AUTO_CREATE: "true"        # 首启自动建表
      DB_AUTO_SEED: "true"          # 首启自动建默认管理员
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /app/data/storage
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8080}"
      JWT_SECRET: "${JWT_SECRET:-MUST_CHANGE_ME_in_production}"   # 生产务必替换
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/app/data
    networks: [cenkormes]

  web-admin:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        FRONTEND: frontend-admin-pro
    restart: unless-stopped
    ports:
      - "${WEB_ADMIN_PORT:-8080}:80"
    depends_on:
      - backend
    networks: [cenkormes]

  web-h5:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        FRONTEND: frontend-h5
    restart: unless-stopped
    ports:
      - "${WEB_H5_PORT:-8081}:80"
    depends_on:
      - backend
    networks: [cenkormes]

networks:
  cenkormes:

volumes:
  mysql_data:
  redis_data:
  storage_data: