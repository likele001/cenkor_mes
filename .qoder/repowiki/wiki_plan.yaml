version: 1

# 文件扫描范围（.gitignore 语法，叠加在 .qoderignore 之上）
scope:
  # 白名单留空 = 扫描所有未被 exclude 的目录（保留按需收紧的能力）
  include: []
  exclude:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/.next/**"
    - "**/venv/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
    - "**/.pytest_cache/**"
    - "**/*.min.js"
    - "**/*.log"
    - "logs/**"
    - "tmp/**"
    - ".qoder/**"
    - ".git/**"
    - "coverage/**"
    - "vendor/**"
    # 构建产物 / 本地数据 / 依赖，不解析
    - "backend/data/**"
    - "backend/uvicorn.log"
    - "backend/celerybeat-schedule*"
    - "backend/.qiniu_pythonsdk_hostscache.json"

repowiki:
  # 技术架构全景文档（MES 项目首选）
  template: architecture
  notes:
    - text: >-
        这是 CenkorMES —— 面向中小型加工厂、单租户私有部署的轻量 MES 制造执行系统（AGPL-3.0）。
        核心业务闭环：产品/型号 → 工序/工价 → 客户/订单 → 工单 → 任务派驻 → 扫码报工 → 审核 → 自动算薪，全程可追溯。
    - text: >-
        技术栈以代码为准：后端 FastAPI + SQLAlchemy + Alembic + Celery；数据库 MySQL 8（连接串 mysql+pymysql）；
        缓存/队列 Redis；对象存储支持 本地磁盘 / 阿里云 OSS / 腾讯云 COS / 七牛。
        前端为 Vue 3 全家桶：PC 管理后台 Element Plus、员工/客户端 H5 Vant 4、微信小程序 uni-app。
        注意：本项目不含 React、不含 Go Gin、不使用 PostgreSQL、不使用 MinIO。
    - text: >-
        后端代码按分层组织，请以此梳理模块职责边界：app/api（admin/h5 等多端路由聚合于 router.py）、
        app/core（配置/安全/数据库/中间件/错误）、app/models、app/schemas、app/crud、app/services、
        app/tasks（Celery 异步任务）。重点梳理服务调用关系与 API 接口分组。
    - text: >-
        重点业务模型：工单(work_orders)、生产任务与派工(tasks/assignments)、排产计划(plans)、报工与算薪
        (reports/salary_reports)、基础数据 BOM/物料/工序/工艺路线/产品 SKU(master)、质检(quality)、
        设备(equipment)、仓库出入库(warehouse)、采购(purchase)、财务/成本(erp/finance)、权限 RBAC(system/roles)。
    - text: >-
        请梳理权限设计（RBAC：users/roles/permissions/tenant 多租户与单租户隔离）、登录安全（JWT、失败限流、
        强密钥校验）、以及 Celery 异步任务与定时任务(cron_jobs/automation)的执行流程。
    - text: >-
        设备/硬件对接以实际代码为准（equipment 模块及工业自动化 automation 相关逻辑）；若发现工业硬件集成点请说明其边界。
    - text: >-
        不需要解析第三方依赖、构建产物、日志与静态资源。文档全部输出简体中文，面向开发人员，结构清晰。
      author: user

  # 页面白名单大纲：启用后进入严格目录模式，Wiki 仅生成以下章节。
  # parent 为空 = 顶层章节；子章节通过 parent 关联，仅允许一层嵌套。
  documents:
    # ===== 顶层：系统总览 =====
    - title: 系统总览与架构全景
      goal: 交代 CenkorMES 定位（单租户私有部署轻量 MES）、核心生产闭环、多端与服务/数据层的整体拓扑、技术选型与部署形态（Docker/Nginx 反代）。
      parent: ""
      hints: 参考 README、docker-compose.yml、backend/app/main.py；含系统架构与服务调用关系总览。

    # ===== 顶层：后端分层架构 =====
    - title: 后端分层架构
      goal: 梳理 FastAPI 后端的分层职责与请求处理链路（API → Schema → Service/CRUD → Model → DB）。
      parent: ""
    - title: API 路由与接口分组
      goal: 说明 app/api/router.py 的聚合方式，admin 与 h5 多端路由分组、接口前缀 /api、各业务 router 的职责边界。
      parent: 后端分层架构
      hints: backend/app/api 下 admin/*、h5/*、dashboard、ai_compat、feishu 等模块。
    - title: 数据模型与 ORM
      goal: 概览 SQLAlchemy 模型体系、base/tenant/user 等基础模型与 Alembic 迁移策略。
      parent: 后端分层架构
      hints: backend/app/models、backend/alembic。
    - title: CRUD 与 Service 业务逻辑层
      goal: 区分 crud（数据访问）与 services（业务编排）的职责与协作关系。
      parent: 后端分层架构
      hints: backend/app/crud、backend/app/services。
    - title: 核心基础设施（配置·安全·中间件·存储）
      goal: 说明 app/core 的配置、JWT 安全、限流/安全头中间件、错误与统一响应、对象存储抽象（local/OSS/COS/七牛）。
      parent: 后端分层架构
      hints: backend/app/core、backend/app/storage。

    # ===== 顶层：前端多端架构 =====
    - title: 前端多端架构
      goal: 概述三端（PC 管理后台 / H5 / 小程序）的技术栈、目录结构与共用 API 层约定。
      parent: ""
    - title: PC 管理后台（frontend-admin-pro）
      goal: 梳理 Vue3 + Element Plus 后台的 api/pages/stores/composables 组织与主要业务页面。
      parent: 前端多端架构
      hints: frontend-admin-pro/src。
    - title: 员工与客户端 H5（frontend-h5）
      goal: 梳理 Vue3 + Vant4 H5 的扫码报工、考勤、工资、客户追溯等移动端页面与路由。
      parent: 前端多端架构
      hints: frontend-h5/src。
    - title: 微信小程序（lightmes-miniapp）
      goal: 梳理 uni-app 小程序的 pages-admin / pages-employee / pages-customer 分层与 api/admin、api/h5 接口适配。
      parent: 前端多端架构
      hints: lightmes-miniapp/src。

    # ===== 顶层：核心业务模型与生产闭环 =====
    - title: 核心业务模型与生产闭环
      goal: 以生产闭环串起各业务域的数据模型与服务协作。
      parent: ""
    - title: 基础数据（物料·BOM·工序·工艺路线·产品 SKU）
      goal: 说明主数据建模及其对工单/排产/报工的支撑关系。
      parent: 核心业务模型与生产闭环
      hints: app/api/admin/master、app/crud、app/models 对应模块。
    - title: 工单·派工与生产任务
      goal: 梳理订单→工单→任务派驻→派工的状态流转与关联模型。
      parent: 核心业务模型与生产闭环
      hints: work_orders、orders、tasks、assignments。
    - title: 排产计划与产能
      goal: 说明计划(plans)的编制、容量与算法能力（OR-Tools/Prophet）的接入点。
      parent: 核心业务模型与生产闭环
      hints: app/api/admin/production/plans。
    - title: 报工·质检与自动算薪
      goal: 梳理扫码报工→审核→质检→自动算薪的数据流与规则。
      parent: 核心业务模型与生产闭环
      hints: reports、report_units、quality、salary_reports、tasks/salary.py。
    - title: 全程追溯
      goal: 说明 trace 追溯链如何贯穿工单/任务/报工/算薪各节点。
      parent: 核心业务模型与生产闭环
      hints: app/api/admin/trace、h5 公共追溯。

    # ===== 顶层：权限与多租户 =====
    - title: 权限体系与多租户
      goal: 梳理 RBAC（用户/角色/权限）、租户模型与单租户隔离、登录安全（JWT、失败限流、强密钥校验）。
      parent: ""
      hints: app/crud/rbac、app/crud/tenant、api/admin/system/{users,roles,permissions}、core/security。

    # ===== 顶层：Celery 异步任务与自动化 =====
    - title: Celery 异步任务与自动化
      goal: 说明 Celery 的 broker/backend 配置、任务定义与调度机制。
      parent: ""
      hints: app/celery_app.py、app/tasks、app/schedulers/database.py。
    - title: 异步任务类型（导出·通知·算薪）
      goal: 分类梳理报表导出、消息通知、工资计算等异步任务的触发与执行流程。
      parent: Celery 异步任务与自动化
      hints: tasks/report_exports.py、tasks/notify.py、tasks/salary.py、tasks/production.py。
    - title: 定时调度与自动化规则
      goal: 说明 cron_jobs 定时任务与 automation 自动化触发逻辑的关系。
      parent: Celery 异步任务与自动化
      hints: api/admin/cron_jobs.py、api/admin/automation、app/schedulers。

    # ===== 顶层：设备对接与外部集成 =====
    - title: 设备对接与外部集成
      goal: 梳理设备/工装管理及其与生产环节的关系，并说明对外集成边界。
      parent: ""
      hints: app/api/admin/equipment、小程序 equipment/molds。
    - title: CRM 适配器与第三方通道
      goal: 说明 integration/crm_adapter 的适配层设计与飞书/企微/钉钉等消息通道接入。
      parent: 设备对接与外部集成
      hints: backend/app/integration/crm_adapter、api/feishu。

knowledgecard:
  notes:
    - text: >-
        知识卡片用于 Agent 理解 CenkorMES。按后端业务模块拆分卡片：生产工单与派工、排产计划、报工与自动算薪、
        基础数据(物料/BOM/工序/工艺路线)、质检、设备、权限与租户、异步任务与自动化、仓库出入库、采购与财务。
    - text: >-
        每张卡片记录：模块职责、入口文件（对应 app/api 下的 router 及 app/crud、app/services 实现）、
        关联的数据库模型。技术栈以 FastAPI + MySQL + Celery、前端 Vue 3 为准。
    - text: >-
        忽略前端组件的 UI 样式文件，重点保留业务逻辑代码与后端服务实现。
      author: user
