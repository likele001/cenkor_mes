# CenkorMES 管理后台生产配置（容器内 nginx）
# 静态资源由 frontend-admin-pro/dist 提供；/api 就地反代到后端 backend:8000 容器内部端口。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 上传等大体积请求由后端处理，前端侧放宽限制
    client_max_body_size 100m;

    # API 反代到后端（compose 服务名 backend，容器内部 8000）
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态 chunk 哈希文件名带版本，可长期缓存；找不到返回 404 而非回退 index.html
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 入口 HTML 不缓存，避免与 assets 哈希不一致
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}