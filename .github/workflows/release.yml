# 监听 vX.Y.Z 标签推送，自动在 GitHub 创建对应 Release。
# 触发方式：scripts/release-all.sh 发版时会打并推送 tag，从而驱动本工作流。
# Release 说明取自 backend/CHANGELOG.json 中该版本号对应的 description。
#
# 2026-11 加固：新增 preflight 闸门。此前 tag 与 CHANGELOG.json 之间没有任何
# 一致性约束——打了 tag 但忘了补 CHANGELOG 条目时，Release 照样创建成功，
# 正文退化成 "Release vX.Y.Z"，而 About 页显示的是新版本号，只有翻 GitHub
# 才发现。（实测该仓库已有 4 个 tag 从未建过 Release，v2.2.0 就是其中之一。）
#
# 闸门里的两个 checkout 是刻意分开的：
#   目标 tag → target/   被校验的对象
#   主干     → tooling/  只取脚本本体
# 因为回填历史版本时，目标 tag 里可能根本没有 release-check.sh（脚本是后加的），
# 直接 checkout 到 tag 再跑脚本会 exit 127。
name: Release

on:
  push:
    tags:
      - "v*"
  # 手动触发：可为任意已存在的 tag 补建 Release（用于回填历史版本）
  workflow_dispatch:
    inputs:
      tag:
        description: "要补建 Release 的已存在 tag（例如 v2.0.4）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ---------- 1. 闸门：tag / VERSION / CHANGELOG.json 三者必须一致 ----------
  preflight:
    name: 版本一致性闸门
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: 检出目标 tag（被校验对象）
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: target

      # 脚本始终从主干取：历史 tag 里不一定有这个文件
      - name: 取出门禁脚本（主干版本）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          sparse-checkout: scripts/release-check.sh
          sparse-checkout-cone-mode: false

      - name: 校验 tag ↔ VERSION ↔ CHANGELOG.json
        run: bash tooling/scripts/release-check.sh --root target --tag "$RELEASE_TAG"

  # ---------- 2. 创建 / 更新 Release ----------
  github-release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    needs: [preflight]
    env:
      # tag 推送事件取 ref_name；手动触发取输入的 tag
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      # 正文取自该 tag 的 CHANGELOG.json，必须 checkout 到 tag 本身
      - name: Checkout 目标 tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: 提取本版本 CHANGELOG 说明
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          python3 - <<'PY'
          import json, os
          tag = os.environ["TAG"]
          try:
              with open("backend/CHANGELOG.json", encoding="utf-8") as f:
                  rows = json.load(f)
          except Exception:
              rows = []
          desc = next((r.get("description", "") for r in rows if r.get("version") == tag), "")
          body = desc or f"Release {tag}"
          notes = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "release-notes.md")
          with open(notes, "w", encoding="utf-8") as f:
              f.write(body + "\n")
          PY
          echo "NOTES_FILE=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"

      - name: 创建 / 更新 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新说明与标题"
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
          fi
