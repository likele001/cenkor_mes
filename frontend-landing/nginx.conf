server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name standalone.mes.cenkor.cn;
    index index.html;
    root /www/wwwroot/cenkormes/frontend-landing;

    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END

    # 复用泛域名证书 *.mes.cenkor.cn（与 ck.mes.cenkor.cn 同一张）
    ssl_certificate    /www/server/panel/vhost/cert/ck.mes.cenkor.cn/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/ck.mes.cenkor.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    error_page 497  https://$host$request_uri;

    error_page 404 /404.html;

    autoindex off;
    server_tokens off;

    # 禁止访问的敏感文件
    location ~* (\.user\.ini|\.htaccess|\.htpasswd|\.env.*|\.git.*|\.bak(up)?|\.old|\.tmp|\.log|\.sql(\.gz)?|LICENSE|README\.md|package(-lock)?\.json|docker-compose\.yml|Dockerfile|requirements\.txt)$
    {
        return 404;
    }

    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.vscode|\.claude|\.idea|\.ssh|\.github|node_modules)/
    {
        return 404;
    }

    # 证书验证目录放行
    location ~ /\.well-known/ {
        allow all;
    }

    # 静态资源缓存
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$
    {
        expires 7d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location = /sitemap.xml { expires 1h; }
    location = /robots.txt  { expires 1h; }

    location ~* \.html$
    {
        expires -1;
    }

    access_log  /www/wwwlogs/standalone.mes.cenkor.cn.log;
    error_log  /www/wwwlogs/standalone.mes.cenkor.cn.error.log;
}
